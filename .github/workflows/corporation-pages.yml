name: Publish Illicit Corporation

on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.webmanifest
      - .github/workflows/corporation-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corporation-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public static artifact
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
